<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemino Advisory</title>

  <!-- Fallback si JavaScript está bloqueado (default ES) -->
  <meta http-equiv="refresh" content="0; url=/es/" />

  <script>
    (function () {
      // 1) Si el usuario ya eligió un idioma antes, respétalo
      try {
        var saved = localStorage.getItem("ga_lang");
        if (saved === "es") { window.location.replace("/es/"); return; }
        if (saved === "en") { window.location.replace("/en/"); return; }
        if (saved === "pt") { window.location.replace("/pt-br/"); return; }
      } catch (e) {}

      // 2) Detectar idioma del navegador (prioriza PT-BR, luego EN, si no ES)
      var lang = (navigator.language || navigator.userLanguage || "es").toLowerCase();

      // Portugués (Brasil) o portugués general → PT-BR
      if (lang.startsWith("pt")) {
        try { localStorage.setItem("ga_lang", "pt"); } catch (e) {}
        window.location.replace("/pt-br/");
        return;
      }

      // Inglés → EN
      if (lang.startsWith("en")) {
        try { localStorage.setItem("ga_lang", "en"); } catch (e) {}
        window.location.replace("/en/");
        return;
      }

      // Default → ES
      try { localStorage.setItem("ga_lang", "es"); } catch (e) {}
      window.location.replace("/es/");
    })();
  </script>
</head>

<body>
  Redirecting…
</body>
</html>
