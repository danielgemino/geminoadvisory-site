<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemino Advisory</title>

  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || "es").toLowerCase();

      if (lang.startsWith("pt")) { window.location.replace("/pt-br/"); return; }
      if (lang.startsWith("en")) { window.location.replace("/en/"); return; }

      window.location.replace("/es/");
    })();
  </script>

  <!-- Fallback si JS está bloqueado -->
  <meta http-equiv="refresh" content="0; url=/es/" />
</head>
<body>
  Redirecting...
</body>
</html>
